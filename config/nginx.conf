# Puma upstream
upstream app {
    # Path to Puma SOCK file, as defined previously
    server unix:///home/root/apps/news/shared/tmp/sockets/news-puma.sock;
}

# =========================
# 1. IP → redirect to domain (HTTP ONLY)
# =========================
server {
    listen 80;
    listen [::]:80;

    server_name 46.225.14.15;

    return 301 https://lyzfol.com$request_uri;
}

# =========================
# 2. HTTP → HTTPS (domain)
# =========================
server {
    listen 80;
    listen [::]:80;

    server_name lyzfol.com www.lyzfol.com;

    return 301 https://lyzfol.com$request_uri;
}

# =========================
# 3. HTTPS (main app)
# =========================
server {
    listen 443 ssl;
    listen [::]:443 ssl ipv6only=on;

    server_name lyzfol.com www.lyzfol.com;

    root /home/root/apps/news/current/public;

    # SSL
    ssl_certificate /etc/ssl/news.pem;
    ssl_certificate_key /etc/ssl/news.key;


    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Static files or Rails
    try_files $uri/index.html $uri @app;

    # Remove trailing slash
    rewrite ^/(.*)/$ /$1 permanent;

    # Rails app (Puma)
    location @app {
        proxy_pass http://app;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_redirect off;
    }

    # ActionCable (WebSockets)
    location /cable {
        proxy_pass http://app/cable;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Errors
    error_page 500 502 503 504 /500.html;

    client_max_body_size 4G;
    keepalive_timeout 10;
}
